name: Independent realmap v0.7.2 cold-viewer candidate
on:
  push:
    paths:
      - 'training/realmap-v0.7.2/**'
      - 'freeze/v0.7.2.json'
      - 'tools/verify_training_v072.py'
      - '.github/workflows/realmap-v072.yml'
  pull_request:
    paths:
      - 'training/realmap-v0.7.2/**'
      - 'freeze/v0.7.2.json'
      - 'tools/verify_training_v072.py'
      - '.github/workflows/realmap-v072.yml'
permissions:
  contents: read
jobs:
  cold-viewer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: training/realmap-v0.7.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify candidate and all earlier sealed source
        run: python ../../tools/verify_training_v072.py
      - name: Record all nations over five cold trials with actual two-second deadline
        run: python scripts/profile_cold_viewer.py --trials 5
      - name: Record five two-CPU cold trials without changing the deadline
        if: runner.os == 'Linux'
        run: python scripts/profile_cold_viewer.py --cpus 2 --trials 5
      - name: All core, exact-route, command-equivalence and timeout-negative tests
        run: python scripts/check_tests_isolated.py
      - name: Three unchanged cold viewer integration tests
        run: |
          python -c "import subprocess,sys; results=[subprocess.run([sys.executable,'-m','unittest','tests.test_dev19_viewer_v7','-v']).returncode for _ in range(3)]; print('cold trial return codes',results); sys.exit(any(results))"
