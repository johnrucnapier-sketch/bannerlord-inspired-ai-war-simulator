name: Independent realmap v0.7.1 performance patch
on:
  push:
    paths:
      - 'training/realmap-v0.7.1/**'
      - 'freeze/v0.7.1.json'
      - 'tools/verify_training_v071.py'
      - '.github/workflows/realmap-v071.yml'
  pull_request:
    paths:
      - 'training/realmap-v0.7.1/**'
      - 'freeze/v0.7.1.json'
      - 'tools/verify_training_v071.py'
      - '.github/workflows/realmap-v071.yml'
permissions:
  contents: read
jobs:
  patch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: training/realmap-v0.7.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify independent identity and preserved v0.7.0
        run: python ../../tools/verify_training_v071.py
      - name: Core, exact routes, commands and real timeout lifecycle tests
        run: python scripts/check_tests_isolated.py
      - name: Three unchanged 2-second cold viewer tests
        run: |
          python -c "import subprocess,sys; results=[subprocess.run([sys.executable,'-m','unittest','tests.test_dev19_viewer_v7','-v']).returncode for _ in range(3)]; print('cold trial return codes',results); sys.exit(any(results))"
