name: Dev20 cavalry strategy v0.7.0
on:
  push:
    paths:
      - 'strategies/submissions/dev20_cavalry_v070/**'
      - 'training/realmap-v0.7.0/**'
      - 'freeze/v0.7.0*'
      - '.github/workflows/dev20-cavalry-v070.yml'
  pull_request:
    paths:
      - 'strategies/submissions/dev20_cavalry_v070/**'
      - 'training/realmap-v0.7.0/**'
      - 'freeze/v0.7.0*'
      - '.github/workflows/dev20-cavalry-v070.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cavalry:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e training/realmap-v0.7.0
      - name: Verify previous releases and unchanged engine identity
        run: python tools/verify_release.py
      - run: python tools/verify_training_v070.py
      - name: Verify the independent cavalry submission identity
        run: python strategies/submissions/dev20_cavalry_v070/verify.py
      - name: Test physical exchanges, routing, privacy and legal decisions
        run: python -m unittest discover -s strategies/submissions/dev20_cavalry_v070 -p "test_*.py" -v
