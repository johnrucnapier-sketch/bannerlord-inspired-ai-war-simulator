name: Frozen baseline integrity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify against trusted base on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:freeze/v0.2.0.json" > "$RUNNER_TEMP/frozen.json"
          git show "$BASE_SHA:tools/verify_release.py" > "$RUNNER_TEMP/verify_release.py"
          python "$RUNNER_TEMP/verify_release.py" --root "$GITHUB_WORKSPACE" --manifest "$RUNNER_TEMP/frozen.json"
      - name: Verify published branch
        if: github.event_name != 'pull_request'
        run: python tools/verify_release.py
