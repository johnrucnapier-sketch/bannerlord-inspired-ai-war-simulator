name: Fourth mode realmap v0.7.0
on:
  push:
    paths:
      - 'training/realmap-v0.7.0/**'
      - 'strategies/submissions/dev19_multinational_v070/**'
      - 'freeze/v0.7.0*'
      - 'tools/verify_training_v070.py'
      - '.github/workflows/realmap-v070.yml'
  pull_request:
    paths:
      - 'training/realmap-v0.7.0/**'
      - 'strategies/submissions/dev19_multinational_v070/**'
      - 'freeze/v0.7.0*'
      - 'tools/verify_training_v070.py'
      - '.github/workflows/realmap-v070.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  realmap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: training/realmap-v0.7.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify fourth-mode payload, derived map and all previous freezes
        run: python ../../tools/verify_training_v070.py
      - name: Isolated core, fog, culture, militia, clans and extinction tests
        run: python scripts/check_tests_isolated.py
      - name: Standalone Dev19 adapter regression tests
        working-directory: .
        run: python -m unittest discover -s strategies/submissions/dev19_multinational_v070 -p "test_*.py" -v
      - name: Eight real processes, SDK, save-load, replay and seed reproduction
        run: python ../../tools/verify_training_v070.py --smoke
      - name: Verify public eight-agent default CLI
        run: python tools/play.py --days 1 --seed 1 --timeout 15 --output runs/default-jsonl
      - name: Check completed private streams and zero agent failures
        run: python ../../tools/verify_training_v070.py --check-match runs/default-jsonl
      - name: Replay public CLI result
        run: python -m aiwar.replay runs/default-jsonl/final.save.json
