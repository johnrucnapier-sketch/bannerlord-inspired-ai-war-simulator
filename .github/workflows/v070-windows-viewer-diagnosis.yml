name: Windows v0.7.0 viewer diagnosis
on:
  push:
    paths:
      - '.github/workflows/v070-windows-viewer-diagnosis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-viewer:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: training/realmap-v0.7.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Check unchanged frozen v0.7.0
        run: python ../../tools/verify_training_v070.py
      - name: Three isolated cold viewer tests with the original 2-second budget
        shell: pwsh
        run: |
          $failures = 0
          foreach ($trial in 1..3) {
            Write-Output "Independent cold trial $trial"
            python -m unittest tests.test_dev19_viewer_v7 -v
            if ($LASTEXITCODE -ne 0) { $failures += 1 }
          }
          Write-Output "Failed trials: $failures / 3"
          if ($failures -gt 0) { exit 1 }
